# =====================================================================
# Ragnar VPS Management Panel - HAProxy front door
# =====================================================================
# THE PORT-SHARING SOLUTION
# -------------------------
# SSH, SSH-WS/WSS, SSH-SSL and every Xray WS protocol share ports 80+443
# and can never kill each other fighting over a port, because:
#
#   * Only HAProxy ever binds 80/443. Everything else lives on loopback
#     high ports (Xray 10001-10004, SSH-WS proxy 10005, SSH 22/109,
#     landing page 10080).
#   * Stage 1 (port 443, tcp mode): peek at the TLS SNI.
#       - SNI "anytls.*"      -> sing-box AnyTLS (raw TLS passthrough,
#                                sing-box terminates its own TLS)
#       - everything else     -> stage 2 on 127.0.0.1:10443
#   * Stage 2 terminates TLS, then inspects the first decrypted bytes:
#       - "GET /ragnar-<proto>"  (a WebSocket upgrade) -> that protocol
#       - any other "GET ..."    -> landing page
#       - NOT HTTP at all (the client waits silently for an SSH banner
#         = SSH-over-SSL)        -> straight to the SSH backend
#     So SSH-SSL and WSS coexist on 443 with zero conflicts.
#   * Port 80 is the same payload routing without TLS; anything that is
#     not a known WS path falls through to the SSH-WS proxy, so classic
#     payload apps (HTTP Custom etc.) keep working on 80 too.
#   * Every backend has a health check; a dead backend is skipped, and
#     the ragnar-watchdog timer revives dead services within a minute.
#
# All routing here is tcp-mode payload inspection - no HTTP parsing -
# so a non-HTTP protocol can never be broken by an HTTP rule.
# =====================================================================

global
    log /dev/log local0
    maxconn 10000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

# ---------------------------------------------------------------------
# Stage 1: port 443 SNI router (no TLS termination here)
# ---------------------------------------------------------------------
frontend fe_443_sni
    bind :::443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl is_anytls req_ssl_sni -i -m beg anytls.
    use_backend be_anytls if is_anytls
    default_backend be_stage2

backend be_anytls
    server singbox 127.0.0.1:10006 check inter 5s fall 2 rise 1

backend be_stage2
    server stage2 127.0.0.1:10443 send-proxy-v2

# ---------------------------------------------------------------------
# Stage 2: TLS termination + payload inspection (loopback only)
# ---------------------------------------------------------------------
frontend fe_443_main
    bind 127.0.0.1:10443 ssl crt /etc/ragnar/certs/haproxy.pem accept-proxy
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.payload(0,4) -m str GET  }
    tcp-request content accept if { req.payload(0,4) -m str POST }
    tcp-request content accept if { req.payload(0,4) -m str CONN }
    tcp-request content accept if { req.payload(0,4) -m str HEAD }
    tcp-request content accept if { req.payload(0,4) -m str OPTI }
    acl is_get    req.payload(0,4) -m str "GET "
    acl p_vless   req.payload(0,64) -m beg "GET /ragnar-vless"
    acl p_vmess   req.payload(0,64) -m beg "GET /ragnar-vmess"
    acl p_trojan  req.payload(0,64) -m beg "GET /ragnar-trojan"
    acl p_ssws    req.payload(0,64) -m beg "GET /ragnar-ssws"
    acl p_sshws   req.payload(0,64) -m beg "GET /ragnar-sshws"
    use_backend be_vless  if p_vless
    use_backend be_vmess  if p_vmess
    use_backend be_trojan if p_trojan
    use_backend be_ssws   if p_ssws
    use_backend be_sshws  if p_sshws
    use_backend be_landing if is_get
    # not HTTP at all -> SSH-over-SSL, direct to the SSH backend
    default_backend be_ssh_ssl

# ---------------------------------------------------------------------
# Port 80: same payload routing, no TLS
# ---------------------------------------------------------------------
frontend fe_80
    bind :::80 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.payload(0,4) -m str GET  }
    tcp-request content accept if { req.payload(0,4) -m str POST }
    tcp-request content accept if { req.payload(0,4) -m str CONN }
    tcp-request content accept if { req.payload(0,4) -m str HEAD }
    tcp-request content accept if { req.payload(0,4) -m str OPTI }
    acl p_vless   req.payload(0,64) -m beg "GET /ragnar-vless"
    acl p_vmess   req.payload(0,64) -m beg "GET /ragnar-vmess"
    acl p_trojan  req.payload(0,64) -m beg "GET /ragnar-trojan"
    acl p_ssws    req.payload(0,64) -m beg "GET /ragnar-ssws"
    acl p_sshws   req.payload(0,64) -m beg "GET /ragnar-sshws"
    use_backend be_vless  if p_vless
    use_backend be_vmess  if p_vmess
    use_backend be_trojan if p_trojan
    use_backend be_ssws   if p_ssws
    use_backend be_sshws  if p_sshws
    # payload apps that don't use the panel path still land on SSH-WS
    default_backend be_sshws

# ---------------------------------------------------------------------
# Backends (all loopback, all health-checked)
# ---------------------------------------------------------------------
backend be_vless
    server xray 127.0.0.1:10001 check inter 5s fall 2 rise 1

backend be_vmess
    server xray 127.0.0.1:10002 check inter 5s fall 2 rise 1

backend be_trojan
    server xray 127.0.0.1:10003 check inter 5s fall 2 rise 1

backend be_ssws
    server xray 127.0.0.1:10004 check inter 5s fall 2 rise 1

backend be_sshws
    server wsproxy 127.0.0.1:10005 check inter 5s fall 2 rise 1

backend be_ssh_ssl
    server dropbear 127.0.0.1:109 check inter 5s fall 2 rise 1
    server openssh  127.0.0.1:22  check inter 5s fall 2 rise 1 backup

backend be_landing
    server landing 127.0.0.1:10080 check inter 5s fall 2 rise 1
