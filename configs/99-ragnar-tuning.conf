# Ragnar VPS Management Panel - network tuning
# Goal: maximum UDP throughput (ZIVPN / UDP Custom / SlowDNS) + many
# concurrent TCP/WS sessions without drops.
#
# ---- congestion control: BBR over fq -------------------------------
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- socket buffers: 64 MB ceilings (default 212 KB starves UDP) ---
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 16777216
net.core.wmem_default = 16777216
net.core.netdev_max_backlog = 32768
net.core.somaxconn = 32768
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# ---- TCP fast paths --------------------------------------------------
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_rmem = 4096 1048576 67108864
net.ipv4.tcp_wmem = 4096 1048576 67108864
net.ipv4.ip_local_port_range = 1024 65535

# ---- forwarding (UDP tunnels NAT user traffic) ----------------------
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# ---- conntrack headroom ----------------------------------------------
net.netfilter.nf_conntrack_max = 524288

# ---- file handles -----------------------------------------------------
fs.file-max = 1048576
